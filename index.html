<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEO PUZZLE — США</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" id="favicon-link" />
  <!-- Applies the saved color scheme to <html> before the stylesheet below
       even loads, let alone before js/game.js's Game constructor runs (that
       one fires on DOMContentLoaded, well after first paint) — without
       this, the page always paints once with the default "blue" :root
       values, THEN visibly snaps to "gray" a beat later for anyone who'd
       picked it. Must stay a blocking inline script (not `defer`/a module)
       specifically so it runs before rendering starts; keep the storage
       key in sync with js/game.js's LAND_SCHEME_STORAGE_KEY. -->
  <script>
    (function () {
      try {
        var scheme = localStorage.getItem('geoPuzzleLandScheme');
        if (scheme === 'gray') document.documentElement.dataset.landScheme = scheme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <button id="btn-brand" class="brand" type="button" title="В главное меню">
        <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="brand-piece-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--neon-cyan)" />
              <stop offset="1" stop-color="var(--neon-violet)" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="#04222b" stroke="var(--neon-cyan)" stroke-opacity="0.4" stroke-width="1.5" />
          <path
            d="M 17,17 L 47,17 L 47,25 A 6.5,6.5 0 0 1 47,38 L 47,47 L 38,47 A 6.5,6.5 0 0 1 25,47 L 17,47 Z"
            fill="url(#brand-piece-grad)"
            stroke="var(--bg-glow)"
            stroke-width="1.2"
          />
        </svg>
        <span class="brand-text">GEO PUZZLE</span>
      </button>
      <div class="hud" id="hud" hidden>
        <span id="hud-level" class="hud-item"></span>
        <span id="hud-progress" class="hud-item hud-chip">0/0</span>
        <span id="hud-groups" class="hud-item hud-chip">Частей: 0</span>
        <span id="hud-timer" class="hud-item hud-chip">00:00</span>
        <label class="toggle" id="toggle-hints-wrap" title="Показать/скрыть фоновый контур карты-подсказки">
          <input type="checkbox" id="toggle-hints" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text" id="toggle-hints-text">Подсказки</span>
        </label>
        <label class="toggle" id="toggle-labels-wrap" title="Показать/скрыть буквы-подписи на кусочках">
          <input type="checkbox" id="toggle-labels" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text" id="toggle-labels-text">Буквы</span>
        </label>
        <label class="toggle" id="toggle-places-wrap" title="Показать/скрыть места на карте" hidden>
          <input type="checkbox" id="toggle-places" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">Места</span>
        </label>
        <label class="toggle" id="toggle-highways-wrap" title="Показать/скрыть шоссе на карте" hidden>
          <input type="checkbox" id="toggle-highways" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">Шоссе</span>
        </label>
        <!-- "Любование прогрессом" — colors every state from black (0) to
             the current color scheme's accent (10+) by adaptive-mode
             success streak (js/successStats.js). States only for now — see
             js/overviewBoard.js's setProgressVisible. -->
        <label class="toggle" id="toggle-progress-wrap" title="Раскрасить штаты по прогрессу (адаптивная статистика)" hidden>
          <input type="checkbox" id="toggle-progress" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">Прогресс</span>
        </label>
        <!-- Real terrain classification (mountains/forests/plains/desert/
             etc., scripts/build_usa_terrain.js) painted under the state
             pieces. States only, same as "Прогресс" above. 3-way segmented
             switch (выкл / цвет / иконки), not a plain on/off checkbox nor
             a cycling button — each third of the track is its own real
             <button> so any mode is reachable directly from whatever mode
             is currently active, no forced click-through-the-middle order.
             See js/game.js's click delegation and
             js/overviewBoard.js's setTerrainMode. -->
        <div class="toggle toggle-3way" id="toggle-terrain-wrap" title="Рельеф: выкл / только цвет / иконки" data-mode="off" hidden>
          <span class="toggle-track toggle-track-3way">
            <button type="button" class="toggle-3way-zone" data-mode="off" aria-label="Рельеф: выключено"></button>
            <button type="button" class="toggle-3way-zone" data-mode="color" aria-label="Рельеф: только цвет"></button>
            <button type="button" class="toggle-3way-zone" data-mode="pattern" aria-label="Рельеф: иконки"></button>
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-text" id="toggle-terrain-text">Рельеф</span>
        </div>
        <!-- Custom dropdown, not a native <select> — a native option list
             ignores almost all CSS (renders with the OS's own light-theme
             popup, black-on-white, completely unstyleable), so it looked
             broken sitting in this dark neon UI. Same button+menu pattern
             as overviewBoard.js's .layer-switcher. -->
        <div class="progress-scope" id="progress-scope-wrap" hidden>
          <button type="button" class="progress-scope-btn" id="progress-scope-btn" aria-haspopup="true" aria-expanded="false" title="По какому режиму показывать прогресс">
            <span id="progress-scope-label">Назови штат</span>
            <svg class="progress-scope-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z" /></svg>
          </button>
          <div class="progress-scope-menu" id="progress-scope-menu" hidden>
            <button type="button" class="progress-scope-option" data-scope="quiz-states">Найди штат</button>
            <button type="button" class="progress-scope-option active" data-scope="name-state-states">Назови штат</button>
            <button type="button" class="progress-scope-option" data-scope="neighbor-states">Назови соседа</button>
            <button type="button" class="progress-scope-option" data-scope="identify-states">Определи штат</button>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" class="coin-balance" id="coin-balance" title="Монеты за верные ответы — нажми, чтобы списать баланс">
          <svg class="coin-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.65" />
          </svg>
          <span id="coin-balance-value">0</span>
        </button>
        <label class="toggle land-scheme-toggle" id="toggle-land-scheme-wrap" title="Цветовая схема — карта, меню и кнопки">
          <input type="checkbox" id="toggle-land-scheme" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <svg class="land-scheme-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle class="scheme-dot" cx="12" cy="12" r="8" />
          </svg>
        </label>
        <!-- Backup/restore for everything the game persists to localStorage
             (coins, adaptive-mode progress, saved settings) — see
             js/dataPortability.js. No account/server, so this file IS the
             only way to move progress between browsers or survive clearing
             site data. -->
        <div class="progress-io" id="progress-io-wrap">
          <button type="button" class="progress-io-btn" id="progress-io-btn" title="Прогресс: экспорт/импорт" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4a1 1 0 0 1 1-1h10.17a1 1 0 0 1 .7.29l2.84 2.84a1 1 0 0 1 .29.7V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M8 3.3V8h7.5V3.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <rect x="7.3" y="12.3" width="9.4" height="6.7" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
          <div class="progress-io-menu" id="progress-io-menu" hidden>
            <button type="button" class="progress-io-option" id="btn-export-progress">Экспорт прогресса</button>
            <button type="button" class="progress-io-option" id="btn-import-progress">Импорт прогресса</button>
            <input type="file" id="import-progress-input" accept="application/json,.json" hidden />
            <span id="progress-io-status" class="progress-io-status" role="status"></span>
          </div>
        </div>
      </div>
    </header>

    <main id="screen-menu" class="screen screen-menu">
      <h1 class="title">GEO PUZZLE</h1>
      <p class="subtitle">Настрой под настроение — и вперёд.</p>

      <div class="menu-columns">
        <section class="panel">
          <h2>Уровень</h2>
          <div id="level-list" class="level-list"></div>
        </section>

        <section class="panel">
          <h2>Режим</h2>
          <div id="mode-list" class="preset-list"></div>
        </section>

        <section class="panel" id="panel-puzzle-settings">
          <h2>Сложность</h2>
          <div id="preset-list" class="preset-list"></div>
          <div id="custom-count-row" class="custom-count-row" hidden>
            <label for="custom-count">Штатов, которые нужно вставить: <strong id="custom-count-value">25</strong></label>
            <input type="range" id="custom-count" min="1" max="50" value="25" />
          </div>
        </section>

        <section class="panel" id="panel-quiz-settings" hidden>
          <h2 id="quiz-panel-heading">Раунд</h2>
          <div id="name-state-difficulty" class="preset-list name-state-difficulty" hidden></div>
          <label class="toggle" id="city-place-entity-row" hidden>
            <input type="checkbox" id="city-place-entity-checkbox" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text" id="city-place-entity-text">Города</span>
          </label>
          <label class="toggle" id="city-place-mode-row" hidden>
            <input type="checkbox" id="city-place-mode-checkbox" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text" id="city-place-mode-text">Найди на карте</span>
          </label>
          <div class="custom-count-row">
            <label for="quiz-count"><span id="quiz-count-label">Сколько штатов спросить</span>: <strong id="quiz-count-value">15</strong></label>
            <input type="range" id="quiz-count" min="1" max="50" value="15" />
          </div>
          <label class="toggle toggle-multiline" id="adaptive-mode-row" hidden>
            <input type="checkbox" id="adaptive-mode-checkbox" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Адаптивный режим — чаще спрашивать штаты, которые даются сложнее</span>
          </label>
          <!-- "Найди X" modes only (quiz/sea-quiz) — right-click submits a
               piece directly instead of the normal click-to-select,
               click-again-to-confirm sequence. See js/quizBoard.js's
               _build/_confirmAnswer. -->
          <label class="toggle toggle-multiline" id="quick-select-row" hidden>
            <input type="checkbox" id="quick-select-checkbox" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Быстрый выбор (ПКМ) — правый клик сразу подтверждает ответ</span>
          </label>
          <div id="quiz-eligible-wrap" class="elig-wrap" hidden></div>
        </section>

        <section class="panel" id="panel-overview-settings" hidden>
          <h2>Отображение</h2>
          <div id="overview-list" class="preset-list"></div>
        </section>
      </div>

      <button id="btn-start" class="btn btn-primary btn-lg">Играть ▶</button>
    </main>

    <main id="screen-game" class="screen screen-game" hidden>
      <div id="quiz-prompt" class="quiz-prompt" hidden>
        <span class="quiz-prompt-label" id="quiz-prompt-label">Найди на карте:</span>
        <strong id="quiz-prompt-name"></strong>
      </div>
      <div id="board-container"></div>
    </main>
  </div>

  <div id="win-bar" class="win-bar" hidden>
    <!-- Language-independent "press R to replay" — a keycap + reload glyph
         reads the same regardless of what language the player speaks, so
         no translated string is needed here at all. Above the button
         (not below) so it isn't the part most likely to get clipped when
         the map's rendered height is short. -->
    <div class="replay-hint" id="replay-hint" title="R" role="button" tabindex="0">
      <span class="replay-key">R</span>
      <svg class="replay-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.997 5.997 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
      </svg>
    </div>
    <button id="btn-back-menu" class="btn btn-primary">Вернуться в меню</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
